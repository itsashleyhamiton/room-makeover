<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Makeover Tracker</title>
  
  <!-- PWA & Mobile Full-Screen Settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Makeover">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1256/1256652.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <!-- Top Header Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-slate-900">Room Makeover</h1>
        <p class="text-xs text-slate-500">URL Item Scraper & Budget Tracker</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="exportData()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg font-medium transition">
          Export JSON
        </button>
        <label class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg font-medium cursor-pointer transition">
          Import
          <input type="file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 space-y-6">

    <!-- Budget Summary Cards -->
    <section class="grid grid-cols-3 gap-3">
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
        <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Total Budget</p>
        <p id="stat-total" class="text-lg font-bold text-slate-900 mt-1">£0.00</p>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
        <p class="text-[11px] font-semibold text-amber-600 uppercase tracking-wider">Left to Buy</p>
        <p id="stat-pending" class="text-lg font-bold text-amber-600 mt-1">£0.00</p>
      </div>
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
        <p class="text-[11px] font-semibold text-emerald-600 uppercase tracking-wider">Purchased</p>
        <p id="stat-purchased" class="text-lg font-bold text-emerald-600 mt-1">£0.00</p>
      </div>
    </section>

    <!-- URL Scraper Input Section -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <h2 class="text-sm font-semibold text-slate-900">Add Item via URL</h2>
      <div class="flex gap-2">
        <input type="url" id="url-input" placeholder="Paste product link (e.g., IKEA, Wayfair)..." 
          class="flex-1 px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button onclick="scrapeUrl()" id="scrape-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm transition flex items-center justify-center min-w-[80px]">
          Fetch
        </button>
      </div>
      <p class="text-[11px] text-slate-400">If automatic scraping fails, you can quickly edit details or add items manually below.</p>
    </section>

    <!-- Filter & Items Header -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">Makeover Items</h2>
        <button onclick="openManualModal()" class="text-xs bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg font-medium transition">
          + Add Manual Item
        </button>
      </div>

      <!-- Item List Container -->
      <div id="items-list" class="space-y-3">
        <!-- Rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- Edit / Manual Item Modal -->
  <div id="item-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 id="modal-title" class="text-base font-bold text-slate-900">Edit Item</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <input type="hidden" id="edit-id">

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Item Name</label>
          <input type="text" id="edit-name" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Price (£)</label>
            <input type="number" step="0.01" id="edit-price" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Quantity</label>
            <input type="number" id="edit-qty" value="1" min="1" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Category / Room Area</label>
          <input type="text" id="edit-category" placeholder="e.g. Lighting, Furniture, Decor" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Image URL</label>
          <input type="url" id="edit-image" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Product Link</label>
          <input type="url" id="edit-url" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl text-sm transition">Cancel</button>
        <button onclick="saveModalItem()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition">Save Item</button>
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    let items = JSON.parse(localStorage.getItem('room_makeover_items') || '[]');

    function saveToStorage() {
      localStorage.setItem('room_makeover_items', JSON.stringify(items));
      render();
    }

    async function scrapeUrl() {
      const urlInput = document.getElementById('url-input');
      const btn = document.getElementById('scrape-btn');
      const targetUrl = urlInput.value.trim();

      if (!targetUrl) return;

      btn.textContent = 'Fetching...';
      btn.disabled = true;

      try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl);
        const data = await res.json();
        
        if (!data.contents) throw new Error('Failed to retrieve page');

        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        let title = doc.querySelector('meta[property="og:title"]')?.getAttribute('content') || doc.querySelector('title')?.innerText || 'New Item';
        let image = doc.querySelector('meta[property="og:image"]')?.getAttribute('content') || '';
        let price = 0;

        // Try JSON-LD schema search
        doc.querySelectorAll('script[type="application/ld+json"]').forEach(script => {
          try {
            const json = JSON.parse(script.innerHTML);
            const prod = Array.isArray(json) ? json.find(i => i['@type'] === 'Product') : json;
            if (prod && prod.offers) {
              const p = prod.offers.price || prod.offers[0]?.price;
              if (p) price = parseFloat(p);
            }
          } catch(e){}
        });

        // Fallback price match
        if (!price) {
          const priceMeta = doc.querySelector('[itemprop="price"]')?.getAttribute('content') || doc.querySelector('.price')?.innerText;
          if (priceMeta) {
            const match = priceMeta.replace(/[^0-9.]/g, '');
            if (match) price = parseFloat(match);
          }
        }

        items.push({
          id: Date.now().toString(),
          name: title.trim(),
          price: isNaN(price) ? 0 : price,
          qty: 1,
          category: 'General',
          image: image,
          url: targetUrl,
          purchased: false
        });

        urlInput.value = '';
        saveToStorage();
      } catch (err) {
        alert('Could not automatically scrape this link due to security restrictions. Opening manual entry form.');
        openManualModal({ name: '', price: 0, qty: 1, category: 'General', image: '', url: targetUrl });
      } finally {
        btn.textContent = 'Fetch';
        btn.disabled = false;
      }
    }

    function render() {
      const listEl = document.getElementById('items-list');
      let totalBudget = 0;
      let totalPurchased = 0;
      let totalPending = 0;

      if (items.length === 0) {
        listEl.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-slate-200">
            <p class="text-slate-400 text-sm">No items added yet. Paste a URL above or add manually.</p>
          </div>
        `;
        document.getElementById('stat-total').textContent = '£0.00';
        document.getElementById('stat-pending').textContent = '£0.00';
        document.getElementById('stat-purchased').textContent = '£0.00';
        return;
      }

      listEl.innerHTML = items.map(item => {
        const itemTotal = (item.price || 0) * (item.qty || 1);
        totalBudget += itemTotal;
        if (item.purchased) {
          totalPurchased += itemTotal;
        } else {
          totalPending += itemTotal;
        }

        return `
          <div class="bg-white rounded-2xl border ${item.purchased ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200'} p-3.5 flex items-center gap-3.5 shadow-sm transition">
            <input type="checkbox" ${item.purchased ? 'checked' : ''} onchange="togglePurchased('${item.id}')" 
              class="w-5 h-5 rounded-lg text-indigo-600 focus:ring-indigo-500 border-slate-300 cursor-pointer">
            
            <div class="w-14 h-14 bg-slate-100 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center border border-slate-100">
              ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<span class="text-[10px] text-slate-400">No Image</span>`}
            </div>

            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-semibold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md uppercase tracking-wider">${item.category || 'General'}</span>
                ${item.url ? `<a href="${item.url}" target="_blank" class="text-xs text-indigo-600 hover:underline truncate">Link ↗</a>` : ''}
              </div>
              <h3 class="text-sm font-semibold text-slate-900 truncate mt-0.5">${item.name}</h3>
              <p class="text-xs text-slate-500 font-medium">£${(item.price || 0).toFixed(2)} × ${item.qty} = <span class="text-slate-900 font-bold">£${itemTotal.toFixed(2)}</span></p>
            </div>

            <div class="flex flex-col items-end gap-1">
              <button onclick="editItem('${item.id}')" class="text-slate-400 hover:text-slate-600 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
              </button>
              <button onclick="deleteItem('${item.id}')" class="text-rose-400 hover:text-rose-600 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('stat-total').textContent = `£${totalBudget.toFixed(2)}`;
      document.getElementById('stat-pending').textContent = `£${totalPending.toFixed(2)}`;
      document.getElementById('stat-purchased').textContent = `£${totalPurchased.toFixed(2)}`;
    }

    function togglePurchased(id) {
      const item = items.find(i => i.id === id);
      if (item) {
        item.purchased = !item.purchased;
        saveToStorage();
      }
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      saveToStorage();
    }

    function openManualModal(item = null) {
      document.getElementById('edit-id').value = item ? item.id : '';
      document.getElementById('edit-name').value = item ? item.name : '';
      document.getElementById('edit-price').value = item ? item.price : '';
      document.getElementById('edit-qty').value = item ? item.qty : 1;
      document.getElementById('edit-category').value = item ? item.category : 'General';
      document.getElementById('edit-image').value = item ? item.image : '';
      document.getElementById('edit-url').value = item ? item.url : '';
      document.getElementById('modal-title').textContent = item && item.id ? 'Edit Item' : 'Add Manual Item';
      document.getElementById('item-modal').classList.remove('hidden');
    }

    function editItem(id) {
      const item = items.find(i => i.id === id);
      if (item) openManualModal(item);
    }

    function closeModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    function saveModalItem() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value.trim() || 'Untitled Item';
      const price = parseFloat(document.getElementById('edit-price').value) || 0;
      const qty = parseInt(document.getElementById('edit-qty').value) || 1;
      const category = document.getElementById('edit-category').value.trim() || 'General';
      const image = document.getElementById('edit-image').value.trim();
      const url = document.getElementById('edit-url').value.trim();

      if (id) {
        const item = items.find(i => i.id === id);
        if (item) {
          item.name = name;
          item.price = price;
          item.qty = qty;
          item.category = category;
          item.image = image;
          item.url = url;
        }
      } else {
        items.push({
          id: Date.now().toString(),
          name, price, qty, category, image, url,
          purchased: false
        });
      }

      closeModal();
      saveToStorage();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "room_makeover_data.json");
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          items = JSON.parse(e.target.result);
          saveToStorage();
        } catch(err) {
          alert('Invalid JSON file');
        }
      };
      reader.readAsText(file);
    }

    // Initial load
    render();
  </script>

  <!-- Service Worker Registration for Offline Cache -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('ServiceWorker registration skipped or failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
